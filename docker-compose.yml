services:
  protein-folding-alpha-geometry:
    build: .
    ports:
      - "8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY before starting}
      MODEL_PROVIDER: mock
      AUDIT_LOG_ACCESS_TOKEN: ${AUDIT_LOG_ACCESS_TOKEN:-}
    restart: unless-stopped
